name: Deploy AdPortal

on:
  push:
    branches:
      - main

env:
  DEPLOY_DIR: /home/ubuntu/AdPortalFrontend
  IMAGE: adportal:latest
  CONTAINER: adportal

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Build and deploy on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ env.DEPLOY_DIR }}"
            git fetch origin main
            git reset --hard origin/main
            test -f .env.production || { echo "missing .env.production in $PWD"; exit 1; }
            docker build -t "${{ env.IMAGE }}" .
            docker stop "${{ env.CONTAINER }}" || true
            docker rm "${{ env.CONTAINER }}" || true
            docker run -d --name "${{ env.CONTAINER }}" \
              --restart unless-stopped \
              -p 3000:8080 \
              "${{ env.IMAGE }}"