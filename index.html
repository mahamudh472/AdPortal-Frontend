<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>AdPortal</title>

    <!-- Warm up the API origin and the image CDN before the JS bundle runs. -->
    <link rel="preconnect" href="https://api.useadportal.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- LCP image: only needed on the marketing home page, so don't make
         dashboard/auth visitors download it. This inline script runs before the
         deferred module bundle and still starts the request early. -->
    <script>
      if (window.location.pathname === "/") {
        var heroPreload = document.createElement("link");
        heroPreload.rel = "preload";
        heroPreload.as = "image";
        heroPreload.href = "/images/hero-v1.webp";
        heroPreload.setAttribute("fetchpriority", "high");
        document.head.appendChild(heroPreload);
      }
    </script>

    <!-- Instant first paint while the JS bundle downloads/executes. React replaces #root on mount. -->
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: #ffffff;
      }
      .boot-screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .boot-mark {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #0f172a;
      }
      .boot-track {
        width: 140px;
        height: 4px;
        border-radius: 999px;
        background: #e2e8f0;
        overflow: hidden;
      }
      .boot-bar {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #3b6ff5;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-live="polite" aria-label="Loading AdPortal">
        <div class="boot-mark">AdPortal</div>
        <div class="boot-track"><span class="boot-bar"></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
